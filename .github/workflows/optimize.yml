name: Conveyor Perception — optimization loop

# This workflow consumes a v0.0.* release (the one the Colab publish cell
# creates), downloads the session.json, asks Gemini to suggest ONE
# concrete code improvement, and opens a PR. The user reviews the PR.
# If merged, the next Colab run picks up the change.
#
# Required secrets:
#   GEMINI_API_KEY — for the Coach analysis (https://aistudio.google.com/app/apikey)
#
# Trigger:
#   release: { types: [published] }  — only for v0.0.* tags (we filter in the job)

on:
  release:
    types: [published]

permissions:
  contents: write       # for the create-pull-request action
  pull-requests: write  # to open the PR
  actions: read         # for the github-script access

jobs:
  suggest-improvement:
    # Only run for v0.0.* releases (skip non-version releases)
    if: startsWith(github.event.release.tag_name, 'v0.0.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --quiet google-generativeai pygithub

      - name: Download current session log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/runs
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'session.json' \
            --dir /tmp/runs \
            --repo "$GITHUB_REPOSITORY"
          ls -la /tmp/runs/
          mv /tmp/runs/session.json /tmp/runs/current.json

      - name: Download previous session log (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: prev
        run: |
          # List the two most recent releases; the second is the previous
          PREV_TAG=$(gh release list --limit 2 --json tagName -q '.[] | select(.tagName != "'"$GITHUB_REF_NAME"'") | .tagName' | head -1)
          if [ -n "$PREV_TAG" ]; then
            echo "Found previous release: $PREV_TAG"
            gh release download "$PREV_TAG" \
              --pattern 'session.json' \
              --dir /tmp/runs \
              --repo "$GITHUB_REPOSITORY" || true
            if [ -f /tmp/runs/session.json ]; then
              mv /tmp/runs/session.json /tmp/runs/previous.json
              echo "previous.json=$(ls -la /tmp/runs/previous.json)" >> "$GITHUB_OUTPUT"
            else
              echo "No previous session.json — first run"
              echo "previous.json=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No previous release — first run"
            echo "previous.json=" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask the Coach for an improvement
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/workflows/coach_analyze.py

      - name: Check if Coach found a change
        id: check
        run: |
          if [ -f /tmp/coach_suggestion.json ]; then
            echo "Coach found a suggestion"
            cat /tmp/coach_suggestion.json
            echo "should_create_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "No actionable suggestion"
            echo "should_create_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the Coach's suggestion
        if: steps.check.outputs.should_create_pr == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: coach/suggestion-${{ github.event.release.tag_name }}
          title: "Coach suggestion: ${{ github.event.release.tag_name }}"
          body: |
            ## Coach optimization suggestion

            Triggered by the release of `${{ github.event.release.tag_name }}`.

            The Coach agent read the new session log and compared it to the
            previous run, then suggested the change below.

            See `/tmp/coach_suggestion.json` for the full reasoning.

            <!-- Coach suggestion start -->
            ${{ env.COACH_BODY }}
            <!-- Coach suggestion end -->

            🤖 Generated by the Conveyor Perception Coach. Please review
            carefully before merging.
          commit-message: "coach: apply suggestion from ${{ github.event.release.tag_name }}"
          add-paths: |
            ${{ env.COACH_PATHS }}
          delete-branch: true
          signoff: false
