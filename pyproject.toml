[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conveyor-perception"
version = "0.1.0"
description = "Industrial perception stack: YOLO26s + OpenCV DNN + ByteTrack + ROS 2 + MCP-style L1 triage"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
authors = [{name = "Ronie Joseph"}]
keywords = [
    "yolo26",
    "industrial-cv",
    "edge-ai",
    "ros2",
    "mcp",
    "trash-sorting",
    "conveyor-perception",
    "object-detection",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime deps — all are also in requirements.txt; this is for `pip install .`
dependencies = [
    "ultralytics>=8.4.121",
    "opencv-python>=4.11.0.86",
    "fastmcp>=3.4.7",
    "pydantic>=2.13.4",
    "supervision>=0.30.0",
    "roboflow>=1.4.1",
    "onnxruntime>=1.20.1",
    "numpy>=1.26,<2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.1.0",
    "pygithub>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]
notebooks = [
    "jupyter>=1.1",
    "matplotlib>=3.10",
    "ipython>=8.30",
]
# ros2 deps are NOT installable on Mac — see docker/Dockerfile.perception

[project.scripts]
conveyor = "conveyor_perception.app.conveyor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Test files routinely use mock objects that mirror third-party APIs
# (OpenCV DNN's setInput(), ultralytics' Results.boxes, etc.) and inner
# mock classes where the first arg is intentionally not `self`.
# Allow these patterns only in tests/.
"tests/**/*.py" = [
    "N802",  # mock method names that mirror real APIs (setInput, etc.)
    "N805",  # inner mock classes with non-`self` first arg
    "N817",  # CamelCase imported as acronym
    "F841",  # assigned-but-unused (test identifiers)
    "UP038", # isinstance(X, (A, B)) tuple syntax
]
# Generated .ipynb files have intentional notebook patterns: !pip install
# shell-magic lines before imports, multiple imports on one line, etc.
# The source of truth is the .py builder (e.g. notebooks/build_demo_v2.py),
# not the .ipynb itself. Lint the .py instead.
"notebooks/**/*.ipynb" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
